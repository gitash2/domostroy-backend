networks:
  mynet:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq@sha256:a0f4e8eefa826f9576d596ca4b1b9168a60118a1a83768dbb5c00d8479cdbfb3
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mynet
  redis:
    image: redis@sha256:bd41d55aae1ecff61b2fafd0d66761223fe94a60373eb6bb781cfbb570a84079
    container_name: redis
    environment:
      - REDIS_PASSWORD=admin
      - REDIS_USER=admin
      - REDIS_USER_PASSWORD=admin
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ./redisdata:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    restart: always
    networks:
      - mynet
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml
    networks:
      - mynet
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - mynet
  postgres:
    image: postgres:15-alpine
    container_name: domostroy
    restart: always
    environment:
      POSTGRES_USER: me
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: domostroy_db
    ports:
      - "25431:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - mynet
  auth:
    image: cr.yandex/crpfl8pv8kjt97qeeh3s/auth:latest
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8082:8082"
  core:
    image: cr.yandex/crpfl8pv8kjt97qeeh3s/core:latest
    depends_on:
      - postgres
    ports:
      - "8081:8081"
  notifications:
    image: cr.yandex/crpfl8pv8kjt97qeeh3s/notifications:latest
    depends_on:
      - rabbitmq
    ports:
      - "8083:8083"

  gateway:
    image: cr.yandex/crpfl8pv8kjt97qeeh3s/gateway:latest
    depends_on:
      - core
      - auth
      - notifications
    ports:
      - "8080:8080"