name: CI/CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ auth, core, notifications, gateway ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build module ${{ matrix.module }}
        run: mvn -B -f pom.xml -pl "${{ matrix.module }}" -am package -DskipTests

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth
          password: ${{ secrets.YC_IAM_TOKEN }}

      - name: Build & push Docker image for ${{ matrix.module }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          build-args: |
            module=${{ matrix.module }}  # прокидываем в Dockerfile переменную module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.module }}:${{ env.COMMIT_SHA }}
            ${{ env.REGISTRY }}/${{ matrix.module }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Yandex VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/your/project
            echo "::group::Pull images"
            docker login ${{ env.REGISTRY }} \
              --username ${{ secrets.DOCKERHUB_USERNAME }} \
              --password ${{ secrets.DOCKERHUB_TOKEN }}
            docker-compose pull
            docker-compose up -d --remove-orphans
            echo "::endgroup::"
  
